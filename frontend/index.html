<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf4ff" />
    <meta name="application-name" content="CRM Leonardo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRM Leonardo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icons/crm-sales.svg?v=2" />
    <title>CRM Leonardo</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.setTimeout(function() { sessionStorage.removeItem('crm_sw_reloaded'); }, 10000);
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function(registration) {
          registration.update();
        }).catch(function() {});
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (sessionStorage.getItem('crm_sw_reloaded') === '1') return;
          sessionStorage.setItem('crm_sw_reloaded', '1');
          window.location.reload();
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
